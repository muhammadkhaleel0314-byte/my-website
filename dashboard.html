<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - CNIC Portal</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: #0f172a; color: white; padding: 20px; }
    .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 15px; margin-bottom: 20px; }
    .btn-logout { padding: 8px 16px; background: #ef4444; color: white; border: none; border-radius: 6px; cursor: pointer; }
    .container { max-width: 500px; margin: auto; background: #1e293b; padding: 20px; border-radius: 12px; }
    .input-field { width: 100%; padding: 10px; margin: 10px 0; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: white; }
    .btn-gen { width: 100%; padding: 10px; background: #10b981; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    #qrcode { display: flex; justify-content: center; margin-top: 20px; background: white; padding: 15px; border-radius: 8px; width: fit-content; margin-left: auto; margin-right: auto; }
  </style>
</head>
<body>

  <div class="header">
    <h2>Welcome, <span id="userDisplay">User</span></h2>
    <button onclick="logout()" class="btn-logout">Logout</button>
  </div>

  <div class="container">
    <h3>CNIC QR Code Generator</h3>
    <input type="text" id="cnicInput" class="input-field" placeholder="Enter CNIC Number (e.g. 35202-xxxxxxx-x)">
    <button onclick="generateQR()" class="btn-gen">Generate QR Code</button>

    <div id="qrcode"></div>
  </div>

  <!-- Firebase v8 SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
    const firebaseConfig = { databaseURL: "https://mywebsite-7016a-default-rtdb.firebaseio.com" };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    const currentUser = localStorage.getItem('loggedInUser');
    const myDeviceId = localStorage.getItem('activeDeviceId');

    // Security Check: Login check
    if (!currentUser || !myDeviceId) {
      window.location.href = "index.html";
    } else {
      document.getElementById('userDisplay').innerText = currentUser;

      // Single Device Restriction Check (Live Listener)
      database.ref('users/' + currentUser + '/activeDeviceId').on('value', snapshot => {
        const activeInDB = snapshot.val();
        if (activeInDB !== myDeviceId) {
          alert("Aap ka account kisi aur device par khol diya gaya hai. Aap logout ho rahe hain!");
          logout();
        }
      });
    }

    function logout() {
      localStorage.removeItem('loggedInUser');
      window.location.href = "index.html";
    }

    let qrObj = null;
    function generateQR() {
      const cnic = document.getElementById('cnicInput').value.trim();
      const qrContainer = document.getElementById('qrcode');
      qrContainer.innerHTML = "";

      if (!cnic) {
        alert("Please enter a CNIC number");
        return;
      }

      qrObj = new QRCode(qrContainer, {
        text: cnic,
        width: 180,
        height: 180
      });
    }
  </script>
</body>
</html>
