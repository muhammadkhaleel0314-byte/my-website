<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Futuristic Portal Analytics Dashboard</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg-dark: #090d16;
      --card-bg: #111827;
      --card-border: rgba(56, 189, 248, 0.15);
      --primary-glow: #38bdf8;
      --secondary-glow: #a855f7;
      --accent-pink: #ec4899;
      --text-light: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    
    body {
      background-color: var(--bg-dark);
      color: var(--text-light);
      min-height: 100vh;
      display: flex;
      overflow-x: hidden;
    }

    /* Sidebar */
    .sidebar {
      width: 80px;
      background: var(--card-bg);
      border-right: 1px solid var(--card-border);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 0;
      gap: 30px;
      position: fixed;
      height: 100vh;
      z-index: 10;
    }

    .sidebar .logo {
      color: var(--primary-glow);
      font-size: 20px;
      font-weight: bold;
    }

    .sidebar-menu {
      display: flex;
      flex-direction: column;
      gap: 20px;
      list-style: none;
    }

    .sidebar-menu li a {
      color: var(--text-muted);
      font-size: 18px;
      text-decoration: none;
      transition: 0.3s;
      padding: 10px;
      border-radius: 10px;
    }

    .sidebar-menu li.active a, .sidebar-menu li a:hover {
      color: var(--primary-glow);
      background: rgba(56, 189, 248, 0.1);
    }

    /* Main Wrapper */
    .main-content {
      margin-left: 80px;
      flex: 1;
      padding: 25px;
      max-width: calc(100% - 80px);
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      background: var(--card-bg);
      padding: 15px 25px;
      border-radius: 14px;
      border: 1px solid var(--card-border);
    }

    .search-box {
      position: relative;
      width: 350px;
    }

    .search-box i {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }

    .search-box input {
      width: 100%;
      background: rgba(9, 13, 22, 0.6);
      border: 1px solid var(--card-border);
      padding: 10px 15px 10px 45px;
      border-radius: 8px;
      color: white;
      outline: none;
      font-size: 14px;
    }

    .search-box input:focus {
      border-color: var(--primary-glow);
    }

    .user-profile {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .user-profile img {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 2px solid var(--primary-glow);
    }

    /* Top Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 25px;
    }

    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 20px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 10px 20px rgba(0,0,0,0.2);
    }

    .stat-card::after {
      content: '';
      position: absolute;
      top: 0; right: 0;
      width: 80px; height: 80px;
      background: radial-gradient(circle, rgba(56,189,248,0.15) 0%, transparent 70%);
      border-radius: 50%;
    }

    .stat-card.purple::after {
      background: radial-gradient(circle, rgba(168,85,247,0.15) 0%, transparent 70%);
    }

    .stat-card.pink::after {
      background: radial-gradient(circle, rgba(236,72,153,0.15) 0%, transparent 70%);
    }

    .stat-title {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .stat-value {
      font-size: 26px;
      font-weight: bold;
      margin-top: 10px;
      color: var(--text-light);
    }

    /* Charts & Analytics Section */
    .analytics-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 20px;
      margin-bottom: 25px;
    }

    @media (max-width: 992px) {
      .analytics-grid { grid-template-columns: 1fr; }
    }

    .chart-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.2);
    }

    .chart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      font-size: 15px;
      font-weight: 600;
      color: var(--text-light);
    }

    .canvas-container {
      position: relative;
      height: 250px;
      width: 100%;
    }

    /* Table Card Section */
    .table-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.2);
    }

    .table-card h3 {
      margin-bottom: 15px;
      font-size: 16px;
      color: var(--text-light);
    }

    .table-responsive {
      width: 100%;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 14px;
      white-space: nowrap;
    }

    th {
      background: #090d16;
      color: var(--primary-glow);
      padding: 12px 15px;
      font-weight: 600;
      border-bottom: 1px solid var(--card-border);
    }

    td {
      padding: 12px 15px;
      border-bottom: 1px solid rgba(51, 65, 85, 0.3);
      color: #cbd5e1;
    }

    tr:hover td {
      background: rgba(56, 189, 248, 0.03);
    }

    .badge {
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      background: rgba(56, 189, 248, 0.1);
      color: var(--primary-glow);
      border: 1px solid rgba(56, 189, 248, 0.2);
    }

    .no-results-msg {
      text-align: center;
      padding: 30px;
      color: var(--text-muted);
      font-style: italic;
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="logo"><i class="fa-solid fa-cube"></i></div>
    <ul class="sidebar-menu">
      <li class="active"><a href="#"><i class="fa-solid fa-chart-pie"></i></a></li>
      <li><a href="#"><i class="fa-solid fa-chart-line"></i></a></li>
      <li><a href="#"><i class="fa-solid fa-user-shield"></i></a></li>
      <li><a href="#"><i class="fa-solid fa-gear"></i></a></li>
    </ul>
  </div>

  <!-- Main Content -->
  <div class="main-content">
    
    <!-- Top Bar with Search Input -->
    <div class="top-bar">
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="searchInput" placeholder="Search portals, users, CNIC..." onkeyup="filterTable()">
      </div>
      <div class="user-profile">
        <span style="font-size: 14px; font-weight: 600;">Admin Panel</span>
        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100" alt="User">
      </div>
    </div>

    <!-- Stats Summary Cards -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-title">Total Searches</div>
        <div class="stat-value" id="totalSearches">0</div>
      </div>
      <div class="stat-card purple">
        <div class="stat-title">Total Records Found</div>
        <div class="stat-value" id="recordsFound" style="color: #34d399;">0</div>
      </div>
      <div class="stat-card pink">
        <div class="stat-title">Records Not Found</div>
        <div class="stat-value" id="recordsNotFound" style="color: #ec4899;">0</div>
      </div>
    </div>

    <!-- Charts Section -->
    <div class="analytics-grid">
      <div class="chart-card">
        <div class="chart-header">
          <span>Search Activity Trends</span>
          <i class="fa-solid fa-ellipsis-vertical" style="color:var(--text-muted)"></i>
        </div>
        <div class="canvas-container">
          <canvas id="lineChart"></canvas>
        </div>
      </div>

      <div class="chart-card">
        <div class="chart-header">
          <span>Records Status Ratio</span>
          <i class="fa-solid fa-ellipsis-vertical" style="color:var(--text-muted)"></i>
        </div>
        <div class="canvas-container">
          <canvas id="donutChart"></canvas>
        </div>
      </div>
    </div>

    <!-- Data Table Card -->
    <div class="table-card">
      <h3>Portal Search Logs & Activity</h3>
      <div class="table-responsive">
        <table id="portalTable">
          <thead>
            <tr>
              <th>Sr #</th>
              <th>Portal Service</th>
              <th>User Name</th>
              <th>CNIC Number</th>
              <th>Timestamp</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <!-- Dynamic data populated via JavaScript -->
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <script>
    // Sample dataset with mixed Found / Not Found statuses
    const portalData = [
      { id: 1, portal: "PMY Verify", user: "Ahmed_Ali", cnic: "35202-1234567-1", time: "2026-06-06 10:30 AM", status: "Verified" },
      { id: 2, portal: "BOP Account", user: "Bilal_Khan", cnic: "42101-9876543-2", time: "2026-06-06 11:15 AM", status: "Not Found" },
      { id: 3, portal: "ACAG Batch", user: "Usman_Ghani", cnic: "37405-5544332-3", time: "2026-06-05 02:40 PM", status: "Verified" },
      { id: 4, portal: "PMY Apply", user: "Zainab_Bibi", cnic: "31102-1122334-4", time: "2026-06-05 04:10 PM", status: "Not Found" },
      { id: 5, portal: "QR Generator", user: "Ahmed_Ali", cnic: "35202-9988776-5", time: "2026-06-04 09:20 AM", status: "Verified" },
      { id: 6, portal: "New Service", user: "Hamza_Raza", cnic: "34101-4433221-6", time: "2026-06-04 01:50 PM", status: "Verified" }
    ];

    function updateStats(data) {
      const totalSearches = portalData.length;
      const foundCount = data.filter(item => item.status !== "Not Found").length;
      const notFoundCount = data.filter(item => item.status === "Not Found").length;

      document.getElementById('totalSearches').innerText = totalSearches;
      document.getElementById('recordsFound').innerText = foundCount;
      document.getElementById('recordsNotFound').innerText = notFoundCount;
    }

    function renderTable(data) {
      const tbody = document.getElementById('tableBody');
      
      if(data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="no-results-msg">No matching records found.</td></tr>`;
        updateStats(data);
        return;
      }

      tbody.innerHTML = data.map((row, index) => `
        <tr>
          <td>${index + 1}</td>
          <td><span class="badge">${row.portal}</span></td>
          <td>${row.user}</td>
          <td>${row.cnic}</td>
          <td>${row.time}</td>
          <td><span style="color: ${row.status === 'Not Found' ? '#ec4899' : '#34d399'}; font-weight: 600;">${row.status}</span></td>
        </tr>
      `).join('');

      updateStats(data);
    }

    function filterTable() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = portalData.filter(item => Object.values(item).some(val => String(val).toLowerCase().includes(query)));
      renderTable(filtered);
    }

    // Initial Load & Charts
    window.onload = () => {
      renderTable(portalData);

      // Line Chart Setup
      const ctxLine = document.getElementById('lineChart').getContext('2d');
      new Chart(ctxLine, {
        type: 'line',
        data: {
          labels: ['Jun 1', 'Jun 2', 'Jun 3', 'Jun 4', 'Jun 5', 'Jun 6'],
          datasets: [{
            label: 'Searches Trend',
            data: [2, 4, 3, 5, 4, 6],
            borderColor: '#38bdf8',
            backgroundColor: 'rgba(56, 189, 248, 0.1)',
            fill: true,
            tension: 0.4
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { labels: { color: '#94a3b8' } } },
          scales: {
            x: { grid: { color: 'rgba(51, 65, 85, 0.2)' }, ticks: { color: '#94a3b8' } },
            y: { grid: { color: 'rgba(51, 65, 85, 0.2)' }, ticks: { color: '#94a3b8' } }
          }
        }
      });

      // Donut Chart Setup
      const ctxDonut = document.getElementById('donutChart').getContext('2d');
      new Chart(ctxDonut, {
        type: 'doughnut',
        data: {
          labels: ['Found / Verified', 'Not Found'],
          datasets: [{
            data: [4, 2],
            backgroundColor: ['#34d399', '#ec4899'],
            borderWidth: 0
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { position: 'bottom', labels: { color: '#94a3b8', boxWidth: 12 } } }
        }
      });
    };
  </script>
</body>
</html>
