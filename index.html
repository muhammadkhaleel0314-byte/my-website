<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --sidebar-bg: #1e293b;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent-color: #3b82f6;
            --danger-color: #ef4444;
            --success-color: #22c55e;
            --border-color: #334155;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            min-height: 100vh;
        }

        /* Left Navigation Sidebar */
        .sidebar {
            width: 260px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }

        .sidebar-top {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .user-welcome {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-color);
        }

        .nav-links {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            color: var(--text-muted);
            text-decoration: none;
            border-radius: 8px;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .nav-item:hover, .nav-item.active {
            background-color: var(--accent-color);
            color: #ffffff;
        }

        /* Logout / Reset Buttons */
        .sidebar-bottom {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
            transition: opacity 0.2s;
        }

        .btn-danger {
            background-color: rgba(239, 68, 68, 0.15);
            color: var(--danger-color);
        }

        .btn-danger:hover {
            background-color: var(--danger-color);
            color: #ffffff;
        }

        .btn-reset {
            background-color: rgba(59, 130, 246, 0.15);
            color: var(--accent-color);
        }

        .btn-reset:hover {
            background-color: var(--accent-color);
            color: #ffffff;
        }

        /* Main Content Area */
        .main-content {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
        }

        .dashboard-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 30px;
            max-width: 800px;
            margin: 0 auto;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .dashboard-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .dashboard-header h2 {
            font-size: 1.5rem;
            color: var(--accent-color);
            margin-bottom: 8px;
        }

        .dashboard-header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .activity-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .activity-item {
            background-color: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            padding: 16px 20px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .activity-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .activity-title {
            font-weight: 600;
            color: var(--text-color);
        }

        .activity-time {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .status-icon {
            color: var(--success-color);
            font-size: 1.2rem;
        }
    </style>
</head>
<body>

    <!-- Left Side Navigation Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-top">
            <div class="user-welcome" id="userWelcome">Welcome back, khaleel</div>
            <nav class="nav-links">
                <a href="#" class="nav-item active">📊 Dashboard</a>
                <a href="#" class="nav-item">📇 CNIC OCR & QR</a>
                <a href="#" class="nav-item">🔗 My Link's</a>
            </nav>
        </div>

        <div class="sidebar-bottom">
            <button class="btn btn-reset" onclick="resetKey()">🔄 Reset Key</button>
            <a href="#" class="btn btn-danger">🚪 Logout</a>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <div class="dashboard-card">
            <div class="dashboard-header">
                <h2>📊 Your Activity Dashboard</h2>
                <p>List of all QR codes generated through your ID</p>
            </div>

            <div class="activity-list" id="activityList">
                <div class="activity-item">
                    <div class="activity-info">
                        <span class="activity-title">CNIC: 3720168974358</span>
                        <span class="activity-time">7/27/2026, 4:06:40 PM</span>
                    </div>
                    <span class="status-icon">✔</span>
                </div>
                <div class="activity-item">
                    <div class="activity-info">
                        <span class="activity-title">CNIC: 3720168974358</span>
                        <span class="activity-time">7/27/2026, 12:58:24 PM</span>
                    </div>
                    <span class="status-icon">✔</span>
                </div>
                <div class="activity-item">
                    <div class="activity-info">
                        <span class="activity-title">CNIC: 3720168974358</span>
                        <span class="activity-time">7/27/2026, 12:56:07 PM</span>
                    </div>
                    <span class="status-icon">✔</span>
                </div>
            </div>
        </div>
    </main>

    <script>
        // 5 Hours Auto-Delete Logic for Uploaded CNIC Data / Images
        function setupAutoDeletion() {
            const EXPIRATION_HOURS = 5;
            const EXPIRATION_TIME_MS = EXPIRATION_HOURS * 60 * 60 * 1000;

            // Example using LocalStorage to track uploaded CNIC records with timestamps
            let uploadedRecords = JSON.parse(localStorage.getItem('cnic_records')) || [];
            
            const currentTime = new Date().getTime();
            
            // Filter out records older than 5 hours
            let validRecords = uploadedRecords.filter(record => {
                return (currentTime - record.timestamp) < EXPIRATION_TIME_MS;
            });

            // Update storage if items were removed
            if (validRecords.length !== uploadedRecords.length) {
                localStorage.setItem('cnic_records', JSON.stringify(validRecords));
                console.log("Expired CNIC images/records automatically deleted after 5 hours.");
            }
        }

        // Run cleanup check on page load
        window.onload = function() {
            setupAutoDeletion();
        };

        function resetKey() {
            alert("Key reset successfully!");
        }
    </script>
</body>
</html>
