<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CNIC Portal & Dashboard</title>
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- QRCode.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <!-- HTML5 QR Code Scanner Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
  <!-- Firebase App & Database -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --btn-green: #10b981;
      --btn-red: #ef4444;
      --text-light: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', 'Segoe UI', sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-light); min-height: 100vh; overflow-x: hidden; }

    /* MODERN LOGIN SCREEN */
    #login-screen {
      position: fixed; inset: 0; background: radial-gradient(circle at top right, #1e1b4b, #0f172a 60%);
      display: flex; justify-content: center; align-items: center; z-index: 100; padding: 20px;
    }
    .login-card {
      background: rgba(30, 41, 59, 0.85); backdrop-filter: blur(16px);
      padding: 30px 25px; border-radius: 20px; width: 100%; max-width: 380px;
      border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      text-align: center;
    }
    .login-icon {
      width: 55px; height: 55px; background: rgba(56, 189, 248, 0.1);
      color: var(--primary); border-radius: 50%; display: flex;
      align-items: center; justify-content: center; margin: 0 auto 15px auto;
      font-size: 24px; border: 1px solid rgba(56, 189, 248, 0.2);
    }
    .login-card h2 { margin-bottom: 5px; color: #ffffff; font-size: 20px; }
    .login-card p.subtitle { color: var(--text-muted); font-size: 12px; margin-bottom: 20px; }

    .input-group { position: relative; margin-bottom: 15px; text-align: left; }
    .input-group i {
      position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
      color: var(--text-muted); font-size: 14px;
    }
    .input-field {
      width: 100%; padding: 12px 14px 12px 40px; border-radius: 10px;
      border: 1px solid #334155; background: rgba(15, 23, 42, 0.6); color: white;
      outline: none; font-size: 14px;
    }
    .input-field:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15); }

    .login-btn {
      width: 100%; padding: 12px; background: linear-gradient(135deg, #38bdf8, #0284c7);
      color: white; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; font-size: 14px;
    }

    /* DASHBOARD LAYOUT & RESPONSIVE FIXES */
    .app-container { display: flex; flex-direction: column; min-height: 100vh; }
    
    .header {
      height: 60px; background: #0f172a; border-bottom: 1px solid #1e293b;
      display: flex; justify-content: space-between; align-items: center;
      padding: 0 20px; position: sticky; top: 0; z-index: 10;
    }
    .user-info { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; }
    .logout-btn {
      background: rgba(239, 68, 68, 0.1); color: var(--btn-red);
      border: 1px solid rgba(239, 68, 68, 0.2); padding: 6px 12px;
      border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 13px;
    }

    .main-wrapper { display: flex; flex: 1; flex-direction: column; }
    @media(min-width: 768px) {
      .main-wrapper { flex-direction: row; }
    }

    .sidebar {
      width: 100%; background: #0f172a; border-bottom: 1px solid #1e293b; padding: 15px;
    }
    @media(min-width: 768px) {
      .sidebar { width: 240px; border-bottom: none; border-right: 1px solid #1e293b; padding: 20px 0; }
    }
    .menu-title { padding: 0 15px 8px; font-size: 10px; color: var(--text-muted); letter-spacing: 1px; font-weight: 700; }
    .nav-sub-btn {
      width: 100%; padding: 10px 15px; background: rgba(56, 189, 248, 0.1); color: var(--primary);
      border: none; text-align: left; font-size: 14px; border-radius: 8px; font-weight: 600; display: flex; align-items: center; gap: 10px;
    }

    .main-content {
      flex: 1; padding: 20px; display: flex; justify-content: center; align-items: flex-start;
    }
    .tab-content { width: 100%; max-width: 500px; }

    .card {
      background: var(--card-bg); padding: 20px; border-radius: 16px;
      border: 1px solid #334155; box-shadow: 0 10px 25px rgba(0,0,0,0.3); text-align: center;
    }
    @media(min-width: 480px) { .card { padding: 30px; } }
    .card h3 { color: var(--primary); margin-bottom: 20px; font-size: 18px; }
    
    .action-btn {
      width: 100%; padding: 12px; background: var(--btn-green); color: white;
      border: none; border-radius: 8px; font-weight: bold; cursor: pointer;
      margin-top: 15px; font-size: 14px; transition: 0.2s;
    }
    .action-btn:hover { opacity: 0.9; }

    #qrcode-box {
      margin-top: 20px; display: flex; justify-content: center;
      background: white; padding: 15px; border-radius: 12px; width: fit-content; margin: 20px auto 0 auto;
    }
    #qrcode-box:empty { display: none; }

    /* HISTORY RECORD TABLE STYLING */
    .history-section { margin-top: 25px; text-align: left; }
    .history-title { font-size: 14px; font-weight: 700; color: var(--text-muted); margin-bottom: 10px; }
    .history-list { max-height: 180px; overflow-y: auto; background: rgba(15, 23, 42, 0.5); border-radius: 8px; border: 1px solid #334155; padding: 8px; }
    .history-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 13px; }
    .history-item:last-child { border-bottom: none; }
  </style>
</head>
<body>

  <!-- LOGIN SCREEN -->
  <div id="login-screen">
    <div class="login-card">
      <div class="login-icon"><i class="fa-solid fa-shield-halved"></i></div>
      <h2>Welcome Back</h2>
      <p class="subtitle">Please enter your credentials</p>

      <div class="input-group">
        <input type="text" id="username" class="input-field" placeholder="Username">
        <i class="fa-solid fa-user"></i>
      </div>

      <div class="input-group">
        <input type="password" id="password" class="input-field" placeholder="Password">
        <i class="fa-solid fa-lock"></i>
      </div>

      <button class="login-btn" onclick="handleLogin()">Sign In</button>
      <p id="login-err" style="color: #ef4444; margin-top: 12px; font-size: 12px; font-weight: 600;"></p>
    </div>
  </div>

  <!-- DASHBOARD UI -->
  <div class="app-container">
    <div class="header">
      <div class="user-info">
        <i class="fa-solid fa-circle-user fa-lg" style="color: var(--primary);"></i>
        <span id="display-user">Guest</span>
      </div>
      <button class="logout-btn" onclick="handleLogout()"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
    </div>

    <div class="main-wrapper">
      <div class="sidebar">
        <div class="menu-title">DASHBOARD MENU</div>
        <button class="nav-sub-btn">
          <i class="fa-solid fa-qrcode"></i> QR & Barcode Scanner
        </button>
      </div>

      <div class="main-content">
        <div class="tab-content active">
          <div class="card">
            <h3>🪪 CNIC Barcode Scanner</h3>
            
            <div class="input-group">
              <input type="text" id="cnic-input" class="input-field" placeholder="13 Digit CNIC Number" maxlength="13">
              <i class="fa-solid fa-id-card"></i>
            </div>

            <!-- Camera Viewport -->
            <div style="margin: 10px 0;">
              <button class="action-btn" style="background: var(--primary-hover); margin-bottom: 8px;" onclick="startScanner()">📷 Start Live Camera Scan</button>
              <div id="reader" style="width: 100%; border-radius: 8px; overflow: hidden;"></div>
            </div>

            <button class="action-btn" onclick="generateQR()">✨ Generate QR Code</button>
            
            <div style="display: flex; justify-content: center; width: 100%;">
              <div id="qrcode-box"></div>
            </div>

            <!-- HISTORY / RECORD SECTION -->
            <div class="history-section">
              <div class="history-title"><i class="fa-solid fa-clock-rotate-left"></i> Your Generated Records</div>
              <div class="history-list" id="history-container">
                <p style="text-align: center; color: var(--text-muted); font-size: 12px; padding: 10px;">No records found yet.</p>
              </div>
            </div>

          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const FIXED_FIRST_12 = "421011234567";

    const firebaseConfig = {
      databaseURL: "https://mywebsite-7016a-default-rtdb.firebaseio.com"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let currentUser = null;
    let html5QrCode = null;

    function getDeviceId() {
      let devId = localStorage.getItem('device_unique_id');
      if (!devId) {
        devId = 'dev_' + Math.random().toString(36).substring(2, 11) + Date.now();
        localStorage.setItem('device_unique_id', devId);
      }
      return devId;
    }

    async function handleLogin() {
      const user = document.getElementById('username').value.trim();
      const pass = document.getElementById('password').value.trim();
      const errEl = document.getElementById('login-err');

      if (!user || !pass) {
        errEl.innerText = "Please fill all fields!";
        return;
      }

      errEl.innerText = "Verifying...";

      try {
        const snapshot = await db.ref(`users/${user}`).once('value');
        const userData = snapshot.val();

        if (userData && userData.password === pass) {
          const thisDeviceId = getDeviceId();

          if (userData.boundDeviceId && userData.boundDeviceId !== thisDeviceId) {
            errEl.innerText = "⛔ Account registered to another device!";
            return;
          }

          if (!userData.boundDeviceId) {
            await db.ref(`users/${user}/boundDeviceId`).set(thisDeviceId);
          }

          currentUser = user;
          localStorage.setItem('logged_user', user);

          document.getElementById('display-user').innerText = user;
          document.getElementById('login-screen').style.display = 'none';
          errEl.innerText = "";
          loadUserHistory(user);

        } else {
          errEl.innerText = "Invalid Username or Password!";
        }
      } catch (e) {
        console.error(e);
        errEl.innerText = "Database connection error!";
      }
    }

    function handleLogout() {
      localStorage.removeItem('logged_user');
      location.reload();
    }

    window.onload = function() {
      const savedUser = localStorage.getItem('logged_user');
      if (savedUser) {
        currentUser = savedUser;
        document.getElementById('display-user').innerText = savedUser;
        document.getElementById('login-screen').style.display = 'none';
        loadUserHistory(savedUser);
      }
    };

    // LIVE CAMERA SCANNER
    function startScanner() {
      if (!html5QrCode) {
        html5QrCode = new Html5Qrcode("reader");
      }

      html5QrCode.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 250, height: 120 } },
        (decodedText) => {
          processScannedText(decodedText);
        },
        (errorMessage) => {}
      ).catch((err) => {
        alert("❌ Camera start karne mein masla hua. Permissions check karein.");
        console.error(err);
      });
    }

    function processScannedText(decodedText) {
      let cnicNumber = "";
      const match13 = decodedText.match(/\d{13}/);

      if (match13) {
        cnicNumber = match13[0];
      } else {
        const cleanDigits = decodedText.replace(/\D/g, "");
        if (cleanDigits.length >= 13) {
          cnicNumber = cleanDigits.substring(0, 13);
        }
      }

      if (cnicNumber && cnicNumber.length === 13) {
        document.getElementById('cnic-input').value = cnicNumber;
        html5QrCode.stop().catch(err => console.log(err));
        generateQR();
      }
    }

    // GENERATE QR AND SAVE TO FIREBASE HISTORY
    function generateQR() {
      const userInput = document.getElementById('cnic-input').value.trim().replace(/-/g, "");
      const qrBox = document.getElementById('qrcode-box');

      if (!/^\d{13}$/.test(userInput)) {
        alert("❌ Invalid! Must Enter Exactly 13 Digits");
        return;
      }

      const fullCNIC = FIXED_FIRST_12 + userInput;
      qrBox.innerHTML = "";
      
      new QRCode(qrBox, {
        text: fullCNIC,
        width: 160,
        height: 160,
        colorDark : "#000000",
        colorLight : "#ffffff",
        correctLevel : QRCode.CorrectLevel.H
      });

      // Save record to Firebase under current user
      if (currentUser) {
        const timeNow = new Date().toLocaleString();
        db.ref(`history/${currentUser}`).push({
          cnic: userInput,
          time: timeNow
        });
      }
    }

    // LOAD HISTORY FROM FIREBASE
    function loadUserHistory(username) {
      const historyContainer = document.getElementById('history-container');
      db.ref(`history/${username}`).on('value', (snapshot) => {
        historyContainer.innerHTML = "";
        const data = snapshot.val();
        
        if (!data) {
          historyContainer.innerHTML = `<p style="text-align: center; color: var(--text-muted); font-size: 12px; padding: 10px;">No records found yet.</p>`;
          return;
        }

        let html = "";
        Object.values(data).reverse().forEach(item => {
          html += `
            <div class="history-item">
              <span style="color: #38bdf8; font-weight: 600;">${item.cnic}</span>
              <span style="color: var(--text-muted); font-size: 11px;">${item.time}</span>
            </div>
          `;
        });
        historyContainer.innerHTML = html;
      });
    }
  </script>
</body>
</html>
