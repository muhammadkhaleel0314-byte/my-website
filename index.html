<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Website</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <style>
    :root { --bg-dark: #0f172a; --card-bg: #1e293b; --sidebar-bg: #0f172a; --primary: #38bdf8; --btn-green: #10b981; --btn-red: #ef4444; --text-light: #f8fafc; --text-muted: #94a3b8; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-light); min-height: 100vh; }
    #login-screen { position: fixed; inset: 0; background: radial-gradient(circle at top right, #1e1b4b, #0f172a 60%); display: flex; justify-content: center; align-items: center; z-index: 100; padding: 20px; }
   .login-card { background: rgba(30, 41, 59, 0.85); backdrop-filter: blur(16px); padding: 30px 25px; border-radius: 20px; width: 100%; max-width: 380px; border: 1px solid rgba(255, 255, 255, 0.1); text-align: center; }
   .input-group { position: relative; margin-bottom: 15px; text-align: left; }
   .input-group i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
   .input-field { width: 100%; padding: 12px 14px 12px 40px; border-radius: 10px; border: 1px solid #334155; background: rgba(15, 23, 42, 0.6); color: white; }
   .login-btn { width: 100%; padding: 12px; background: linear-gradient(135deg, #38bdf8, #0284c7); color: white; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; }
   .app-container { display: none; }
   .header { height: 60px; background: #0f172a; border-bottom: 1px solid #1e293b; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; }
   .main-wrapper { display: flex; }
   .sidebar { width: 260px; background: var(--sidebar-bg); border-right: 1px solid #1e293b; padding: 20px 10px; }
   .nav-sub-btn { padding: 10px 15px; background: transparent; color: var(--text-muted); border: none; width: 100%; text-align: left; font-size: 14px; border-radius: 8px; font-weight: 600; display: flex; align-items: center; gap: 10px; cursor: pointer; }
   .nav-sub-btn.active { background: rgba(56, 189, 248, 0.1); color: var(--primary); }
   .main-content { flex: 1; padding: 20px; }
   .tab-content { display: none; }
   .tab-content.active { display: block; }
   .card { background: var(--card-bg); padding: 30px; border-radius: 16px; border: 1px solid #334155; text-align: center; }
   .action-btn { width: 100%; padding: 12px; background: var(--btn-green); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 15px; }
    #qrcode-box { margin: 20px auto 0 auto; background: white; padding: 15px; border-radius: 12px; width: fit-content; }
   .report-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 15px; }
   .report-table th,.report-table td { padding: 10px; border: 1px solid #334155; text-align: left; }
  </style>
</head>
<body>

  <div id="login-screen">
    <div class="login-card">
      <h2>Welcome Back</h2>
      <div class="input-group"><input type="text" id="username" class="input-field" placeholder="Username"><i class="fa-solid fa-user"></i></div>
      <div class="input-group"><input type="password" id="password" class="input-field" placeholder="Password"><i class="fa-solid fa-lock"></i></div>
      <button class="login-btn" onclick="handleLogin()">Sign In</button>
      <p id="login-err" style="color: #ef4444; margin-top: 12px; font-size: 12px;"></p>
    </div>
  </div>

  <div class="app-container" id="app-container">
    <div class="header">
      <div><i class="fa-solid fa-circle-user"></i> <span id="display-user">Guest</span></div>
      <button onclick="handleLogout()" style="background: var(--btn-red); color: white; border: none; padding: 8px 12px; border-radius: 8px; cursor: pointer;">Logout</button>
    </div>
    <div class="main-wrapper">
      <div class="sidebar">
          <button class="nav-sub-btn active" onclick="switchTab('dashboard-tab', this)"><i class="fa-solid fa-gauge"></i> Dashboard</button>
          <button class="nav-sub-btn" onclick="switchTab('qr-tab', this)"><i class="fa-solid fa-qrcode"></i> CNIC OCR & QR</button>
          <button class="nav-sub-btn" onclick="switchTab('report-tab', this)"><i class="fa-solid fa-file-excel"></i> Branch Report</button>
      </div>
      <div class="main-content">
        <div id="dashboard-tab" class="tab-content active"><div class="card"><h3>📊 Dashboard</h3><div id="dashboard-history-list">No records found.</div></div></div>

        <div id="qr-tab" class="tab-content"><div class="card"><h3>🪪 CNIC OCR</h3><label class="action-btn" style="background: var(--primary); cursor: pointer;">📷 Upload<input type="file" id="cnic-image-upload" accept="image/*" onchange="handleCNICImageUpload(event)" style="display: none;"></label><img id="cnic-preview" style="max-width:100%; margin-top:10px; display:none;"><p id="ocr-status"></p><div id="qrcode-box"></div></div></div>

        <div id="report-tab" class="tab-content"><div class="card" style="text-align: left;"><h3>📊 Branch Report</h3><input type="file" id="excel-upload" accept=".xlsx,.xls" onchange="handleExcelUpload(event)"><div id="report-config" style="display: none; margin-top: 15px;"><select id="branch-select"></select><select id="name-select"></select><select id="balance-select"></select><button class="action-btn" onclick="processReport()">Generate</button></div><div id="report-output"></div><button id="download-report-btn" class="action-btn" style="display: none; background: var(--btn-green);" onclick="downloadReport()">Download Excel</button></div></div>
      </div>
    </div>
  </div>

  <script>
    const FIXED_FIRST_12 = "421011234567";
    let GOOGLE_API_KEY = localStorage.getItem('gemini_key') || prompt("Gemini Key ڈالیں");
    if(GOOGLE_API_KEY) localStorage.setItem('gemini_key', GOOGLE_API_KEY);

    const firebaseConfig = { databaseURL: "https://mywebsite-7016a-default-rtdb.firebaseio.com" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let currentUser = null;
    let uploadedDf = null;

    async function handleLogin() {
      const user = document.getElementById('username').value.trim();
      const pass = document.getElementById('password').value.trim();
      const errEl = document.getElementById('login-err');
      errEl.innerText = "Verifying...";
      try {
        const snapshot = await db.ref(`users/${user}`).once('value');
        const userData = snapshot.val();
        if (userData && userData.password === pass) {
          currentUser = user;
          localStorage.setItem('logged_user', user);
          document.getElementById('display-user').innerText = user;
          document.getElementById('login-screen').style.display = 'none';
          document.getElementById('app-container').style.display = 'block';
          errEl.innerText = "";
        } else { errEl.innerText = "Invalid Username or Password!"; }
      } catch (e) { errEl.innerText = "Firebase Error. Rules check کریں"; }
    }
    function handleLogout() { localStorage.removeItem('logged_user'); location.reload(); }
    window.onload = function() { const savedUser = localStorage.getItem('logged_user'); if (savedUser) { currentUser = savedUser; document.getElementById('display-user').innerText = savedUser; document.getElementById('login-screen').style.display = 'none'; document.getElementById('app-container').style.display = 'block'; } };
    function switchTab(tabId, btn) { document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active')); document.querySelectorAll('.nav-sub-btn').forEach(b => b.classList.remove('active')); document.getElementById(tabId).classList.add('active'); btn.classList.add('active'); }

    async function handleCNICImageUpload(event) {
        const file = event.target.files[0]; if (!file) return;
        document.getElementById('cnic-preview').src = URL.createObjectURL(file);
        document.getElementById('cnic-preview').style.display = 'block';
        const reader = new FileReader(); reader.readAsDataURL(file); reader.onloadend = async function() {
            const base64Image = reader.result.split(',')[1];
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GOOGLE_API_KEY}`;
            const body = { "contents": [{ "parts": [ { "text": "CNIC number only 13 digits" }, { "inline_data": { "mime_type": "image/jpeg", "data": base64Image } } ] }] };
            const res = await fetch(url, { method: 'POST', body: JSON.stringify(body) }); const data = await res.json();
            let foundCNIC = data.candidates[0].content.parts[0].text.replace(/\D/g, "").slice(-13);
            document.getElementById('ocr-status').innerText = "Found: " + foundCNIC;
            document.getElementById('qrcode-box').innerHTML = "";
            new QRCode(document.getElementById('qrcode-box'), { text: FIXED_FIRST_12 + foundCNIC, width: 160, height: 160 });
        }
    }

    function handleExcelUpload(event) {
        const file = event.target.files[0]; const reader = new FileReader();
        reader.onload = (e) => {
            const workbook = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
            uploadedDf = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], { header: 1 });
            const headers = uploadedDf[0];
            ['branch-select','name-select','balance-select'].forEach((id,i)=>{ document.getElementById(id).innerHTML = headers.map((h,idx)=>`<option value="${idx}">${h}</option>`).join('') });
            document.getElementById('report-config').style.display = 'block';
        };
        reader.readAsArrayBuffer(file);
    }
    function processReport() {
        const b = document.getElementById('branch-select').value, n = document.getElementById('name-select').value, bal = document.getElementById('balance-select').value;
        let grouped = {};
        uploadedDf.slice(1).forEach(row=>{ let key = row[b]+"-"+row[n]; grouped[key] = (grouped[key]||0) + parseFloat(String(row[bal]).replace(/,/g,''))||0 });
        let html = '<table class="report-table"><tr><th>Branch</th><th>Name</th><th>Balance</th></tr>';
        for(let k in grouped){ let [br,na]=k.split('-'); html+=`<tr><td>${br}</td><td>${na}</td><td>${grouped[k].toLocaleString()}</td></tr>` }
        document.getElementById('report-output').innerHTML = html+'</table>';
        document.getElementById('download-report-btn').style.display='block';
    }
    function downloadReport(){ alert("Download ready") }
  </script>
</body>
</html>
