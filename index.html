<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CNIC Portal & Dashboard - Gemini OCR</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

  <style>
    :root {
      --bg-dark: #0f172a; --card-bg: #1e293b; --sidebar-bg: #0f172a;
      --primary: #38bdf8; --primary-hover: #0284c7; --btn-green: #10b981;
      --btn-red: #ef4444; --text-light: #f8fafc; --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-light); min-height: 100vh; overflow-x: hidden; }
    #login-screen { position: fixed; inset: 0; background: radial-gradient(circle at top right, #1e1b4b, #0f172a 60%); display: flex; justify-content: center; align-items: center; z-index: 100; padding: 20px; }
    .login-card { background: rgba(30, 41, 59, 0.85); backdrop-filter: blur(16px); padding: 30px 25px; border-radius: 20px; width: 100%; max-width: 380px; border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 20px 40px rgba(0,0,0,0.6); text-align: center; }
    .login-icon { width: 55px; height: 55px; background: rgba(56, 189, 248, 0.1); color: var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 15px auto; font-size: 24px; border: 1px solid rgba(56, 189, 248, 0.2); }
    .login-card h2 { margin-bottom: 5px; color: #ffffff; font-size: 20px; }
    .login-card p.subtitle { color: var(--text-muted); font-size: 12px; margin-bottom: 20px; }
    .input-group { position: relative; margin-bottom: 15px; text-align: left; }
    .input-group i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 14px; }
    .input-field { width: 100%; padding: 12px 14px 12px 40px; border-radius: 10px; border: 1px solid #334155; background: rgba(15, 23, 42, 0.6); color: white; outline: none; font-size: 14px; }
    .input-field:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15); }
    .login-btn { width: 100%; padding: 12px; background: linear-gradient(135deg, #38bdf8, #0284c7); color: white; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; font-size: 14px; }
    .app-container { display: flex; flex-direction: column; min-height: 100vh; display: none; }
    .header { height: 60px; background: #0f172a; border-bottom: 1px solid #1e293b; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; position: sticky; top: 0; z-index: 10; }
    .user-info { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; }
    .logout-btn { background: rgba(239, 68, 68, 0.1); color: var(--btn-red); border: 1px solid rgba(239, 68, 68, 0.2); padding: 6px 12px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 13px; }
    .main-wrapper { display: flex; flex: 1; flex-direction: column; }
    @media(min-width: 768px) { .main-wrapper { flex-direction: row; } }
    .sidebar { width: 100%; background: var(--sidebar-bg); border-bottom: 1px solid #1e293b; padding: 15px; display: flex; gap: 10px; overflow-x: auto; }
    @media(min-width: 768px) { .sidebar { width: 240px; border-bottom: none; border-right: 1px solid #1e293b; padding: 20px 10px; flex-direction: column; gap: 5px; } }
    .menu-title { padding: 0 10px 8px; font-size: 10px; color: var(--text-muted); letter-spacing: 1px; font-weight: 700; display: none; }
    @media(min-width: 768px) { .menu-title { display: block; } }
    .nav-sub-btn { padding: 10px 15px; background: transparent; color: var(--text-muted); border: none; text-align: left; font-size: 14px; border-radius: 8px; font-weight: 600; display: flex; align-items: center; gap: 10px; cursor: pointer; transition: 0.2s; white-space: nowrap; }
    .nav-sub-btn:hover, .nav-sub-btn.active { background: rgba(56, 189, 248, 0.1); color: var(--primary); }
    .main-content { flex: 1; padding: 20px; display: flex; justify-content: center; align-items: flex-start; }
    .tab-content { display: none; width: 100%; max-width: 500px; }
    .tab-content.active { display: block; }
    .card { background: var(--card-bg); padding: 20px; border-radius: 16px; border: 1px solid #334155; box-shadow: 0 10px 25px rgba(0,0,0,0.3); text-align: center; }
    @media(min-width: 480px) { .card { padding: 30px; } }
    .card h3 { color: var(--primary); margin-bottom: 20px; font-size: 18px; }
    .action-btn { width: 100%; padding: 12px; background: var(--btn-green); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 15px; font-size: 14px; transition: 0.2s; }
    .action-btn:hover { opacity: 0.9; }
    #qrcode-box { margin-top: 20px; display: flex; justify-content: center; background: white; padding: 15px; border-radius: 12px; width: fit-content; margin: 20px auto 0 auto; }
    #qrcode-box:empty { display: none; }
    #reader { border: 2px dashed var(--primary); }
    .history-list { display: flex; flex-direction: column; gap: 10px; max-height: 350px; overflow-y: auto; text-align: left; }
    .history-card-item { background: rgba(15, 23, 42, 0.6); border: 1px solid #334155; padding: 12px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; }
  </style>
</head>
<body>

  <div id="login-screen">
    <div class="login-card">
      <div class="login-icon"><i class="fa-solid fa-shield-halved"></i></div>
      <h2>Welcome Portal</h2>
      <p class="subtitle">Sign in with your assigned ID</p>
      <div class="input-group"><input type="text" id="username" class="input-field" placeholder="Username"><i class="fa-solid fa-user"></i></div>
      <div class="input-group"><input type="password" id="password" class="input-field" placeholder="Password"><i class="fa-solid fa-lock"></i></div>
      <button class="login-btn" onclick="handleLogin()">Sign In</button>
      <p id="login-err" style="color: #ef4444; margin-top: 12px; font-size: 12px; font-weight: 600;"></p>
    </div>
  </div>

  <div class="app-container" id="app-container">
    <div class="header">
      <div class="user-info"><i class="fa-solid fa-circle-user fa-lg" style="color: var(--primary);"></i><span id="display-user">Guest</span></div>
      <button class="logout-btn" onclick="handleLogout()"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
    </div>
    <div class="main-wrapper">
      <div class="sidebar">
        <div class="menu-title">NAVIGATION</div>
        <button class="nav-sub-btn active" onclick="switchTab('dashboard-tab', this)"><i class="fa-solid fa-gauge"></i> Dashboard</button>
        <button class="nav-sub-btn" onclick="switchTab('qr-tab', this)"><i class="fa-solid fa-qrcode"></i> QR Generator & Scanner</button>
        <button class="nav-sub-btn" onclick="switchTab('pdf-tab', this)"><i class="fa-solid fa-file-pdf"></i> PDF Generator</button>
      </div>
      <div class="main-content">
        <div id="dashboard-tab" class="tab-content active">
          <div class="card">
            <h3>📊 Your Activity Dashboard</h3>
            <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 20px;">List of all QR codes generated through your ID</p>
            <div class="history-list" id="dashboard-history-list"><p style="text-align: center; color: var(--text-muted); font-size: 13px; padding: 20px;">No records found.</p></div>
          </div>
        </div>
        <div id="qr-tab" class="tab-content">
          <div class="card">
            <h3>🪪 CNIC Gemini OCR + Scanner</h3>
            <div class="input-group"><input type="text" id="cnic-input" class="input-field" placeholder="13 Digit CNIC Number" maxlength="13"><i class="fa-solid fa-id-card"></i></div>

            <div style="margin: 10px 0;">
              <button class="action-btn" style="background: var(--primary-hover); margin-bottom: 8px;" onclick="startScanner()">📷 Live Camera Scan - 2 Sec</button>
              <div id="reader" style="width: 100%; border-radius: 8px; overflow: hidden;"></div>
            </div>

            <button class="action-btn" onclick="generateQR()">✨ Generate QR Code</button>

            <div style="margin: 15px 0; border-top: 1px dashed #334155; padding-top:15px;">
              <p style="font-size:12px; color:var(--text-muted); margin-bottom:8px;">اب Gemini AI - 3 سیکنڈ میں</p>
              <label class="action-btn" style="background: var(--primary); cursor: pointer;">📷 Upload ID Card Image<input type="file" id="cnic-image-upload" accept="image/*" onchange="handleCNICImageUpload(event)" style="display: none;"></label>
              <img id="cnic-preview" style="max-width:100%; margin-top:10px; border-radius:8px; display:none;">
              <p id="ocr-status" style="font-size:12px; color:var(--text-muted); margin-top:5px;"></p>
            </div>

            <div style="display: flex; justify-content: center; width: 100%;"><div id="qrcode-box"></div></div>
          </div>
        </div>
        <div id="pdf-tab" class="tab-content">
          <div class="card">
            <h3>📄 Excel to PDF Generator</h3>
            <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 20px;">Excel.xlsx فائل Upload کریں، PDF خود بن جائے گی</p>
            <label class="action-btn" style="background: var(--primary); cursor: pointer;">📤 Choose Excel File<input type="file" id="excel-upload" accept=".xlsx,.xls" onchange="handleExcelUpload(event)" style="display: none;"></label>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const FIXED_FIRST_12 = "421011234567";

    let GOOGLE_API_KEY = localStorage.getItem('gemini_key');
    if(!GOOGLE_API_KEY){
        GOOGLE_API_KEY = prompt("🔑 پہلی بار: اپنی Gemini API Key یہاں paste کریں\nKey: aistudio.google.com");
        if(GOOGLE_API_KEY) localStorage.setItem('gemini_key', GOOGLE_API_KEY);
    }

    const firebaseConfig = { databaseURL: "https://mywebsite-7016a-default-rtdb.firebaseio.com" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let currentUser = null;
    let html5QrCode = null;

    function getDeviceId() {
      let devId = localStorage.getItem('device_unique_id');
      if (!devId) { devId = 'dev_' + Math.random().toString(36).substring(2, 11) + Date.now(); localStorage.setItem('device_unique_id', devId); }
      return devId;
    }

    async function handleLogin() {
      const user = document.getElementById('username').value.trim();
      const pass = document.getElementById('password').value.trim();
      const errEl = document.getElementById('login-err');
      if (!user || !pass) { errEl.innerText = "Please fill all fields!"; return; }
      errEl.innerText = "Verifying...";
      try {
        const snapshot = await db.ref(`users/${user}`).once('value');
        const userData = snapshot.val();
        if (userData && userData.password === pass) {
          const thisDeviceId = getDeviceId();
          if (userData.boundDeviceId && userData.boundDeviceId !== thisDeviceId) { errEl.innerText = "⛔ Account registered to another device!"; return; }
          if (!userData.boundDeviceId) { await db.ref(`users/${user}/boundDeviceId`).set(thisDeviceId); }
          currentUser = user;
          localStorage.setItem('logged_user', user);
          document.getElementById('display-user').innerText = user;
          document.getElementById('login-screen').style.display = 'none';
          document.getElementById('app-container').style.display = 'flex';
          errEl.innerText = "";
          loadUserHistory(user);
        } else { errEl.innerText = "Invalid Username or Password!"; }
      } catch (e) { console.error(e); errEl.innerText = "Database connection error!"; }
    }

    function handleLogout() { localStorage.removeItem('logged_user'); location.reload(); }

    window.onload = function() {
      const savedUser = localStorage.getItem('logged_user');
      if (savedUser) {
        currentUser = savedUser;
        document.getElementById('display-user').innerText = savedUser;
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('app-container').style.display = 'flex';
        loadUserHistory(savedUser);
      }
    };

    function switchTab(tabId, btn) {
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.nav-sub-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      btn.classList.add('active');
      if (tabId !== 'qr-tab' && html5QrCode) { html5QrCode.stop().catch(err => console.log(err)); }
    }

    function startScanner() {
      if (!html5QrCode) { html5QrCode = new Html5Qrcode("reader"); }
      html5QrCode.start( { facingMode: "environment" }, { fps: 10, qrbox: { width: 280, height: 100 } },
        (decodedText) => { processScannedText(decodedText); },
        (errorMessage) => {}
      ).catch((err) => { alert("❌ Camera Permission دیں"); console.error(err); });
    }

    function processScannedText(decodedText) {
      let cnicNumber = "";
      const match13 = decodedText.match(/\d{13}/);
      if (match13) { cnicNumber = match13[0]; }
      else { const cleanDigits = decodedText.replace(/\D/g, ""); if (cleanDigits.length >= 13) { cnicNumber = cleanDigits.slice(-13); } }
      if (cnicNumber && cnicNumber.length === 13) {
        document.getElementById('cnic-input').value = cnicNumber;
        if (html5QrCode) { html5QrCode.stop().catch(err => console.log(err)); }
        generateQR();
      }
    }

    function generateQR() {
      const userInput = document.getElementById('cnic-input').value.trim().replace(/-/g, "");
      const qrBox = document.getElementById('qrcode-box');
      if (!/^\d{13}$/.test(userInput)) { alert("❌ Invalid! Must Enter Exactly 13 Digits"); return; }
      const fullCNIC = FIXED_FIRST_12 + userInput;
      qrBox.innerHTML = "";
      new QRCode(qrBox, { text: fullCNIC, width: 160, height: 160, colorDark : "#000", colorLight : "#ffffff", correctLevel : QRCode.CorrectLevel.H });
      if (currentUser) {
        const timeNow = new Date().toLocaleString();
        db.ref(`history/${currentUser}`).push({ cnic: userInput, time: timeNow });
      }
    }

    function loadUserHistory(username) {
      const historyList = document.getElementById('dashboard-history-list');
      db.ref(`history/${username}`).on('value', (snapshot) => {
        historyList.innerHTML = "";
        const data = snapshot.val();
        if (!data) { historyList.innerHTML = `<p style="text-align: center; color: var(--text-muted); font-size: 13px; padding: 20px;">No records found.</p>`; return; }
        let html = "";
        Object.values(data).reverse().forEach(item => {
          html += `<div class="history-card-item"><div><div style="color: #38bdf8; font-weight: 600; font-size: 14px;">CNIC: ${item.cnic}</div><div style="color: var(--text-muted); font-size: 11px; margin-top: 2px;">${item.time}</div></div><i class="fa-solid fa-circle-check" style="color: var(--btn-green);"></i></div>`;
        });
        historyList.innerHTML = html;
      });
    }

    function handleExcelUpload(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
            const sheetName = workbook.SheetNames[0];
            const jsonData = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName], { header: 1 });
            generatePDFFromData(jsonData);
        };
        reader.readAsArrayBuffer(file);
    }

    function generatePDFFromData(data) {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        doc.setFontSize(16);
        doc.text("CNIC Portal - Excel Report", 14, 20);
        const headers = data[0];
        const rows = data.slice(1);
        doc.autoTable({ head: [headers], body: rows, startY: 30, theme: 'grid' });
        doc.save('report-from-excel.pdf');
        alert("✅ PDF Successfully Generated!");
    }

    // ===== GEMINI OCR - FIXED MODEL =====
    async function handleCNICImageUpload(event) {
        const file = event.target.files[0];
        if (!file) return;

        if(!GOOGLE_API_KEY){ alert("Key نہیں ملی۔ Page refresh کریں"); return; }

        const statusEl = document.getElementById('ocr-status');
        const previewEl = document.getElementById('cnic-preview');
        const cnicInput = document.getElementById('cnic-input');

        previewEl.src = URL.createObjectURL(file);
        previewEl.style.display = 'block';
        statusEl.innerText = "Status: Gemini سے پڑھوا رہا ہوں... 3 سیکنڈ";
        statusEl.style.color = "var(--primary)";

        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onloadend = async function() {
            const base64Image = reader.result.split(',')[1];
            // Updated model name to gemini-2.5-flash
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GOOGLE_API_KEY}`;

            const body = {
              "contents": [{
                "parts": [
                  { "text": "اس پاکستانی CNIC کارڈ کی تصویر سے صرف 13 ہندسوں کا CNIC نمبر نکال کر دو۔ صرف نمبر دو، اور کچھ نہیں۔ اگر نہ ملے تو Not Found لکھو۔" },
                  { "inline_data": { "mime_type": "image/jpeg", "data": base64Image } }
                ]
              }]
            };

            try {
                const response = await fetch(url, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body) });
                const data = await response.json();
                
                console.log("API Response:", data);

                if (data.error) {
                    statusEl.innerText = `Status: API Error - ${data.error.message || 'Key چیک کریں'}`;
                    statusEl.style.color = "var(--btn-red)";
                    return;
                }

                if (!data.candidates || !data.candidates[0].content) {
                    statusEl.innerText = "Status: ❌ ماڈل نے ڈیٹا بلاک کر دیا یا نہیں پڑھ سکا۔";
                    statusEl.style.color = "var(--btn-red)";
                    return;
                }

                let text = data.candidates[0].content.parts[0].text.trim();
                let foundCNIC = text.replace(/\D/g, "");

                if(foundCNIC.length >= 13){
                    foundCNIC = foundCNIC.slice(-13);
                    cnicInput.value = foundCNIC;
                    statusEl.innerText = `Status: ✅ مل گیا: ${foundCNIC}`;
                    statusEl.style.color = "var(--btn-green)";
                    setTimeout(() => { generateQR(); statusEl.innerText += " | QR بن گیا"; }, 500);
                } else {
                    statusEl.innerText = "Status: ❌ CNIC نمبر نہیں ملا۔ صاف تصویر لگائیں";
                    statusEl.style.color = "var(--btn-red)";
                }
            } catch(error){
                statusEl.innerText = "Status: Network Error یا غلط Key";
                console.error(error);
            }
        }
    }
  </script>
</body>
</html>
